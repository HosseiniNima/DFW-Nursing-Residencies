# DFW hospitals and the web pages that get checked for nurse residencies.
#
# Each health system lists:
#   sources:   pages to check. One career site usually covers every hospital
#              in the system, so sources live at the system level.
#                kind: page  → a program info page; looks for cohort dates and
#                              "applications open" wording, and notices changes
#                kind: jobs  → a job board / search results; picks out
#                              residency / new-grad job postings
#                kind: workday → a Workday career site; searched through its API
#                              using the `search` terms
#                dfw_only: true drops postings that don't name a DFW campus or
#                              city (for statewide/national job boards)
#                render: auto (default) | always | never
#                              "always" loads the page in a headless browser
#                              (for sites that build the page with JavaScript)
#                verified: false marks URL patterns that couldn't be confirmed
#                              when this list was written. The report's
#                              "Source health" table shows if they work.
#   aliases:   names job aggregators use for this system
#   hospitals: lat/lon are approximate (fine for distance ranking).
#              match: words that tie a job posting to this campus (defaults to
#              the city).
#
# Sources under the "aggregators" system are matched against every hospital.

systems:
  - id: thr
    name: Texas Health Resources
    aliases: [Texas Health, THR]
    sources:
      - id: thr-gn-residency-search
        kind: jobs
        url: https://jobs.texashealth.org/listjobs/?keyword=(GN%20OR%20%22Graduate%20Nurse%22)%20AND%20Residency&category=RN%2FRegistered%20Nurse
        render: always
    hospitals:
      - {id: thr-dallas, name: Texas Health Presbyterian Hospital Dallas, city: Dallas, lat: 32.8810, lon: -96.7630, match: [Presbyterian Dallas, Dallas]}
      - {id: thr-fort-worth, name: Texas Health Harris Methodist Hospital Fort Worth, city: Fort Worth, lat: 32.7335, lon: -97.3410, match: [Harris Methodist Fort Worth, Fort Worth]}
